format = """
[](#5e81ac)\
$os\
$username\
[](bg:#81a1c1 fg:#5e81ac)\
$directory\
[](bg:#88c0d0 fg:#81a1c1)\
$git_branch\
$git_status\
[](bg:#8fbcbb fg:#88c0d0)\
$nodejs\
$bun\
$java\
$rust\
$golang\
$php\
$c\
$lua\
[](bg:#d9dee9 fg:#8fbcbb)\
$cmd_duration\
[ ](fg:#d9dee9)\
\n$character"""
command_timeout = 1000

[username]
show_always = true
format = "[$user ](fg:#2e3440 bg:#5e81ac)"

[os]
disabled = false
style = "fg:#2e3440 bg:#5e81ac"

[os.symbols]
Ubuntu = "󰕈 "
Fedora = "󰣛 "
Arch = "󰣇 "

[directory]
style = "fg:#2e3440 bg:#81a1c1"
format = "[ $path ]($style)"
truncation_length = 2

[git_branch]
symbol = ""
format = '[[ $symbol $branch ](fg:#2e3440 bg:#88c0d0)]($style)'

[git_status]
format = '[[($all_status$ahead_behind )](fg:#2e3440 bg:#88c0d0)]($style)'
untracked = " "
modified = " "
staged = " "
ahead = ""
diverged = "󰃻 "
deleted = "󰆴"

[nodejs]
symbol = " "
format = '[ $symbol($version )]($style)'
style = "fg:#2e3440 bg:#8fbcbb"

[bun]
symbol = " "
format = '[ $symbol($version )]($style)'
style = "fg:#2e3440 bg:#8fbcbb"

[java]
symbol = " "
format = '[ $symbol($version )]($style)'
style = "fg:#2e3440 bg:#8fbcbb"

[rust]
symbol = ""
format = '[ $symbol($version )]($style)'
style = "fg:#2e3440 bg:#8fbcbb"

[golang]
symbol = " "
format = '[ $symbol($version )]($style)'
style = "fg:#2e3440 bg:#8fbcbb"

[php]
symbol = " "
format = '[ $symbol($version )]($style)'
style = "fg:#2e3440 bg:#8fbcbb"

[c]
symbol = " "
format = '[ $symbol($version )]($style)'
style = "fg:#2e3440 bg:#8fbcbb"

[lua]
symbol = " "
format = '[ $symbol($version )]($style)'
style = "fg:#2e3440 bg:#8fbcbb"

[cmd_duration]
format = "[ 󰔚 $duration ]($style)"
style = "fg:#2e3440 bg:#d9dee9"

[character]
success_symbol = "[ 󱞩](bold #d8dee9)"
error_symbol = "[ 󱞩](bold #bf616a)"

