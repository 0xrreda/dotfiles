add_newline = false
format = """$character$directory"""
right_format = """$all"""
command_timeout = 1000

[git_branch]
symbol = " "
format = '[[ $symbol $branch ](fg:#8ba4b0)]($style)'

[git_status]
format = '[[($all_status$ahead_behind )](fg:#8ba4b0)]($style)'

[nodejs]
symbol = " "
format = '[[ $symbol ($version) ](fg:#a292a3)]($style)'

[bun]
symbol = " "
format = '[[ $symbol ($version) ](fg:#a292a3)]($style)'

[java]
symbol = " "
format = '[[ $symbol ($version) ](fg:#a292a3)]($style)'

[rust]
symbol = " "
format = '[[ $symbol ($version) ](fg:#a292a3)]($style)'

[golang]
symbol = " "
format = '[[ $symbol ($version) ](fg:#a292a3)]($style)'

[php]
symbol = " "
format = '[[ $symbol ($version) ](fg:#a292a3)]($style)'

[c]
symbol = " "
format = '[[ $symbol ($version) ](fg:#a292a3)]($style)'

[lua]
symbol = " "
format = '[[ $symbol ($version) ](fg:#a292a3)]($style)'

[python]
symbol = " "
format = '[[ $symbol ($version) ](fg:#a292a3)]($style)'

[character]
disabled = false
success_symbol = '[ ](bold fg:#A4A7A4)'
error_symbol = '[ ](bold fg:#c4746e)'


[directory]
format = "[$path ](bold fg:#A4A7A4)"
truncation_length = 1

