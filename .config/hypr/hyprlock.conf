# BACKGROUND
background {
    monitor = 
    path = /home/reda/Pictures/wallpapres/gruv-dirt-track.jpg
    blur_passes = 1
    contrast = 0.9
    brightness = 0.5
    vibrancy = 0.17
    vibrancy_darkness = 0
}

# GENERAL
general {
    no_fade_in = true
    no_fade_out = true
    hide_cursor = false
    grace = 0
    disable_loading_bar = true
}

# INPUT FIELD
input-field {
    monitor =
    size = 300, 40
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(20, 23, 29, 0)
    inner_color = rgba(164, 167, 164, 0.5)
    font_color = rgba(197, 201, 199)
    fade_on_empty = false
    font_family = syne
    placeholder_text = 
    hide_input = false
    position = 0, -200
    halign = center
    valign = center
}

# Hour-Time
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%H")"
    color = rgba(101, 133, 148, 1)
    font_family = JetBrainsMono Nerd Font Bold
    font_size = 180
    position = 0, 300
    halign = center
    valign = center
}

# Minute-Time
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%M")"
    color = rgba(197, 201, 199, 1)
    font_family = JetBrainsMono Nerd Font Bold
    font_size = 180
    position = 0, 75
    halign = center
    valign = center
}

# Day-Date-Month
label {
    monitor =
    text = cmd[update:1000] echo "<span color='##c5c9c700'>$(date '+%A, ')</span><span color='##65859400'>$(date '+%d %B')</span>"
    font_size = 30
    font_family = Johanvaaler
    position = 0, -80
    halign = center
    valign = center
}

