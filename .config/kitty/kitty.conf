# vim:fileencoding=utf-8:foldmethod=marker

allow_remote_control         yes

# <==theme==>
include                      kanso.conf 

# <==Font==>
font_size                    12
font_family                  VictorMono NF SemiBold
bold_font                    auto
italic_font                  auto
bold_italic_font             auto

# <==Background==>
dynamic_background_opacity   yes
background_opacity           0.75
# background_image           /home/reda/Downloads/times-square-night-bright-billboards-desktop-wallpaper.jpg
# background_image_layout    scaled
# background_tint            0.9

# <==Layouts==>
enabled_layouts              grid

# <==borders==>
active_border_color          #A4A7A4
inactive_border_color        #A4A7A4

# <==windows==>
hide_window_decorations      yes
window_border_width          1
window_padding_width         4

# <==Tab==>
tab_bar_min_tabs             0
tab_bar_style                separator
tab_separator                " / "
# tab_title_template         " {'󰊠 ' if (index % 2) == 0 else '󰆘 '}{fmt.bold}{sup.index}"
# active_tab_title_template  " 󰮯 {fmt.nobold}{sup.index}"

# <==KeyMaps==>
map ctrl+shift+k             next_window 
map ctrl+shift+j             previous_window


startup_session              ./session.conf
